apiVersion: v1
kind: Secret
metadata:
  name: pipelines-as-code-secret
  namespace: pipelines-as-code
type: Opaque
stringData:
  # TODO: create a GitHub App (personal org) and fill in the real values when
  # copying to pipelines-as-code-github-secrets.yaml
  github-private-key: |-
    -----BEGIN PRIVATE KEY-----
    YOUR-REAL-KEY-HERE
    -----END PRIVATE KEY-----
  github-application-id: "<GITHUB_APP_ID>"
  webhook.secret: "<WEBHOOK_SECRET>"
  # Webhook relay URL from https://hook.pipelinesascode.com/new — lets GitHub
  # reach the PaC controller without a public IP (gosmee client forwards it).
  smee: "https://hook.pipelinesascode.com/<YOUR-CHANNEL>"